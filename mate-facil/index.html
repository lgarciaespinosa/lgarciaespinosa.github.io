<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MateFácil - Juego de matemáticas simplificado y accesible para rehabilitación cognitiva y visión reducida. Sin menús, sin complicaciones.">
  <title>MateFácil</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="yellow" data-size="gigante">

  <!-- Marcadores superiores (Simplificados) -->
  <header class="app-header" role="banner">
    <div class="stats-bar" role="region" aria-label="Estadísticas">
      <div class="stat-item" id="stat-streak" aria-live="polite">
        <span class="stat-label">RACHA:</span>
        <span id="streak-display" class="stat-value">0</span>
      </div>
      <div class="stat-item" id="stat-score">
        <span class="stat-label">PUNTOS:</span>
        <span id="score-display" class="stat-value">0</span>
      </div>
      <div class="stat-item" id="stat-record">
        <span class="stat-label">RÉCORD:</span>
        <span id="record-display" class="stat-value">0</span>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal del Juego -->
  <main class="game-container">
    
    <!-- PANTALLA ÚNICA DE PREGUNTAS -->
    <section id="screen-play" class="game-screen active">
      <!-- Nivel e Indicación -->
      <div class="level-indicator" id="level-indicator" aria-live="polite">
        Nivel 1
      </div>

      <!-- Pregunta Gigante -->
      <div class="question-container">
        <h1 id="question-text" class="question-text" aria-live="assertive">
          Cargando...
        </h1>
      </div>

      <!-- Opciones de Respuesta en Columna -->
      <div class="options-container" role="radiogroup" aria-labelledby="question-text">
        <button class="option-btn" data-index="0" role="radio" aria-checked="false">
          <span class="option-num" aria-hidden="true">1</span>
          <span class="option-value">-</span>
        </button>
        <button class="option-btn" data-index="1" role="radio" aria-checked="false">
          <span class="option-num" aria-hidden="true">2</span>
          <span class="option-value">-</span>
        </button>
        <button class="option-btn" data-index="2" role="radio" aria-checked="false">
          <span class="option-num" aria-hidden="true">3</span>
          <span class="option-value">-</span>
        </button>
        <button class="option-btn" data-index="3" role="radio" aria-checked="false">
          <span class="option-num" aria-hidden="true">4</span>
          <span class="option-value">-</span>
        </button>
      </div>

      <!-- Anuncio de accesibilidad para resultados -->
      <div id="sr-feedback" class="sr-only" aria-live="assertive"></div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script>
    // Registro del Service Worker para soporte offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registrado.', reg.scope))
          .catch(err => console.warn('Error al registrar Service Worker.', err));
      });
    }
  </script>
</body>
</html>
